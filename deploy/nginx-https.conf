server {
    listen 80;
    server_name smash.xedoc.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/smash.xedoc.ru/acme;
    }
    location / { return 301 https://smash.xedoc.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name smash.xedoc.ru;
    root /var/www/smash.xedoc.ru/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/smash.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smash.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/smash.xedoc.ru.access.log;
    error_log /var/log/nginx/smash.xedoc.ru.error.log;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;

    gzip_static on;
    location = /api/scores.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/scores.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\. { return 404; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}

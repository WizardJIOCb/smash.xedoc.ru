location = /coop {
    proxy_pass http://127.0.0.1:18791;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location = /coop-game/api/scores.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/smash.xedoc.ru/coop-current/api/scores.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

location ^~ /coop-game/api/ { return 404; }

location ^~ /coop-game/ {
    alias /var/www/smash.xedoc.ru/coop-current/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /coop-health {
    proxy_pass http://127.0.0.1:18791/health;
}
